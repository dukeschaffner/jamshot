<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 5 stacked horizontal rectangles in pastel colors -->
  
  <!-- Layer 1: Seafoam Green -->
  <rect x="40" y="40" width="120" height="24" rx="6" ry="6" fill="#98d7c2"/>
  
  <!-- Layer 2: Rustic Pink -->
  <rect x="40" y="72" width="120" height="24" rx="6" ry="6" fill="#e8b4b8"/>
  
  <!-- Layer 3: Pastel Yellow -->
  <rect x="40" y="104" width="120" height="24" rx="6" ry="6" fill="#f9eeb8"/>
  
  <!-- Layer 4: Pastel Blue -->
  <rect x="40" y="136" width="120" height="24" rx="6" ry="6" fill="#b5d8eb"/>
  
  <!-- Layer 5: Pastel Lavender -->
  <rect x="40" y="168" width="120" height="24" rx="6" ry="6" fill="#d9c8e3"/>
</svg>