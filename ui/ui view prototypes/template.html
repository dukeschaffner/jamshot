<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collabo - Music Collaboration Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --white: #ffffff;
            --seafoam: #93E9BE;
            --seafoam-light: #C1F4D9;
            --rustic-pink: #E9A9A1;
            --rustic-pink-light: #F4C9C4;
            --gray-light: #f5f5f5;
            --gray: #e0e0e0;
            --dark: #333333;
            --text: #555555;
            --shadow: rgba(0, 0, 0, 0.05);
            --border-light: #eeeeee;
            
            /* Dark mode variables */
            --dark-bg: #121212;
            --dark-card-bg: #1e1e1e;
            --dark-text-primary: #ffffff;
            --dark-text-secondary: #a1a1aa;
            --dark-border-color: #2e2e2e;
            --dark-hover-color: #2a2a2a;
            --dark-shadow: rgba(0, 0, 0, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--white);
            color: var(--text);
            display: grid;
            grid-template-columns: 240px 1fr;
            grid-template-rows: 1fr 80px;
            grid-template-areas:
                "sidebar main"
                "player player";
            min-height: 100vh;
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body.dark-mode {
            background-color: var(--dark-bg);
            color: var(--dark-text-primary);
        }

        /* Navbar Styles */
        .navbar {
            grid-area: sidebar;
            width: 240px;
            background-color: var(--white);
            border-right: 1px solid var(--gray);
            display: flex;
            flex-direction: column;
            padding: 24px 0;
            height: 100%;
            box-shadow: 2px 0px 10px var(--shadow);
            z-index: 100;
            position: relative;
            transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        body.dark-mode .navbar {
            background-color: var(--dark-card-bg);
            border-right: 1px solid var(--dark-border-color);
            box-shadow: 2px 0px 10px var(--dark-shadow);
        }

        .logo {
            padding: 0 24px 24px;
            font-size: 28px;
            font-weight: 700;
            color: var(--dark);
            text-align: left;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            transition: color 0.3s ease;
        }

        body.dark-mode .logo {
            color: var(--dark-text-primary);
        }

        .logo span {
            background: linear-gradient(90deg, var(--seafoam), var(--rustic-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 12px 24px;
            text-decoration: none;
            color: var(--text);
            font-weight: 500;
            transition: all 0.2s ease;
            margin-bottom: 8px;
        }

        .nav-link:hover {
            background-color: var(--seafoam-light);
        }

        .nav-link.active {
            color: var(--dark);
            background-color: var(--seafoam-light);
            border-left: 4px solid var(--seafoam);
            padding-left: 20px;
        }

        .nav-link svg {
            margin-right: 16px;
            width: 20px;
            height: 20px;
        }

        .nav-link i {
            margin-right: 16px;
            width: 20px;
            font-size: 1.2rem;
            text-align: center;
        }

        .theme-toggle {
            margin-top: auto;
            margin-bottom: 16px;
        }

        body.dark-mode .nav-link:hover {
            background-color: var(--dark-hover-color);
        }

        body.dark-mode .nav-link.active {
            background-color: var(--dark-hover-color);
            border-left: 4px solid var(--seafoam);
        }

        .search-box {
            margin: 0 24px 24px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            border: 1px solid var(--gray);
            border-radius: 20px;
            background-color: var(--gray-light);
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        body.dark-mode .search-box input {
            background-color: var(--dark-hover-color);
            border-color: var(--dark-border-color);
            color: var(--dark-text-primary);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text);
        }

        .upload-btn {
            margin: 12px 24px 24px;
            padding: 12px 20px;
            background: linear-gradient(90deg, var(--seafoam), var(--rustic-pink));
            color: white;
            border: none;
            border-radius: 24px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .upload-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .upload-btn svg {
            margin-right: 8px;
        }

        .user-profile {
            padding: 12px 24px;
            display: flex;
            align-items: center;
            margin-top: auto;
            cursor: pointer;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--rustic-pink-light);
            overflow: hidden;
            margin-right: 12px;
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-info {
            flex-grow: 1;
        }

        .user-name {
            font-weight: 600;
            color: var(--dark);
            font-size: 14px;
        }

        .user-handle {
            font-size: 12px;
            color: var(--text);
        }

        /* Main Content Styles */
        .main-content {
            grid-area: main;
            overflow-y: auto;
            padding-bottom: 20px;
        }

        .feed-header {
            padding: 24px 40px;
            border-bottom: 1px solid var(--gray);
            transition: border-color 0.3s ease;
        }

        body.dark-mode .feed-header {
            border-bottom: 1px solid var(--dark-border-color);
        }

        .feed-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 8px;
            transition: color 0.3s ease;
        }

        body.dark-mode .feed-title {
            color: var(--dark-text-primary);
        }

        .feed-subtitle {
            font-size: 14px;
            color: var(--text);
            transition: color 0.3s ease;
        }

        body.dark-mode .feed-subtitle {
            color: var(--dark-text-secondary);
        }

        .feed {
            padding: 0;
            display: flex;
            flex-direction: column;
        }

        /* Track Styles - Twitter-like */
        .track-item {
            padding: 16px 40px;
            border-bottom: 1px solid var(--border-light);
            transition: background-color 0.2s ease;
        }

        body.dark-mode .track-item {
            border-bottom: 1px solid var(--dark-border-color);
        }

        .track-item:hover {
            background-color: var(--gray-light);
        }

        body.dark-mode .track-item:hover {
            background-color: var(--dark-hover-color);
        }

        .track-item.expanded {
            background-color: var(--white);
        }

        body.dark-mode .track-item.expanded {
            background-color: var(--dark-card-bg);
        }

        .track-main {
            display: grid;
            grid-template-columns: 60px 1fr auto;
            gap: 16px;
            align-items: center;
            position: relative;
            cursor: pointer;
        }

        .track-play {
            width: 60px;
            height: 60px;
            background-color: var(--seafoam);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.2s, background-color 0.2s;
            position: relative;
            z-index: 2;
            color: var(--white);
            font-size: 1.3rem;
        }

        .track-play:hover {
            transform: scale(1.05);
            background-color: var(--rustic-pink);
        }

        .track-play svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        .track-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .track-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 4px;
            transition: color 0.3s ease;
        }

        body.dark-mode .track-title {
            color: var(--dark-text-primary);
        }

        .track-artist {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .artist-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            overflow: hidden;
        }

        .artist-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .artist-name {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text);
            transition: color 0.3s ease;
        }

        body.dark-mode .artist-name {
            color: var(--dark-text-secondary);
        }

        .track-meta {
            display: flex;
            gap: 12px;
            font-size: 0.9rem;
            color: var(--text);
            transition: color 0.3s ease;
        }

        body.dark-mode .track-meta {
            color: var(--dark-text-secondary);
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
            min-width: 50px;
        }

        .meta-item svg, .meta-item i {
            width: 14px;
            height: 14px;
            margin-right: 2px;
        }

        .track-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .action-btn {
            background: transparent;
            border: none;
            color: var(--text);
            cursor: pointer;
            font-size: 1.1rem;
            transition: color 0.2s, background-color 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px;
        }

        body.dark-mode .action-btn {
            color: var(--dark-text-secondary);
        }

        .action-btn:hover {
            color: var(--dark);
        }

        body.dark-mode .action-btn:hover {
            color: var(--dark-text-primary);
        }

        .collab-btn {
            background-color: var(--rustic-pink-light);
            color: var(--dark);
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background-color 0.3s ease, color 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        body.dark-mode .collab-btn {
            background-color: var(--rustic-pink);
            color: var(--dark-text-primary);
        }

        .collab-btn:hover {
            background-color: var(--rustic-pink);
            color: white;
        }

        .like-btn, .share-btn {
            background: transparent;
            border: none;
            padding: 8px;
        }

        .like-btn.active {
            color: var(--rustic-pink);
        }

        body.dark-mode .like-btn.active {
            color: var(--rustic-pink-light);
        }

        .like-btn:hover, .share-btn:hover {
            color: var(--dark);
        }

        /* Expanded Track Related Section */
        .track-details {
            display: none;
            padding: 16px 0 16px 76px; /* Align with content, accounting for play button */
            margin-top: 8px;
            border-top: 1px dashed var(--border-light);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        body.dark-mode .track-details {
            background-color: transparent;
            border-top: 1px dashed var(--dark-border-color);
        }

        .track-item.expanded .track-details {
            display: block;
        }

        .related-tracks {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .track-relation {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
            margin-top: 12px;
            transition: color 0.3s ease;
        }

        body.dark-mode .track-relation {
            color: var(--dark-text-secondary);
        }

        .track-relation:first-child {
            margin-top: 0;
        }

        .related-track {
            display: grid;
            grid-template-columns: 40px 1fr auto;
            padding: 8px;
            gap: 12px;
            align-items: center;
            border-radius: 8px;
            transition: background-color 0.2s;
        }

        .related-track:hover {
            background-color: var(--gray);
        }

        body.dark-mode .related-track:hover {
            background-color: var(--dark-hover-color);
        }

        .related-play {
            width: 40px;
            height: 40px;
            background-color: var(--seafoam-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background-color 0.2s;
            color: var(--dark);
            font-size: 0.9rem;
        }

        .related-play:hover {
            background-color: var(--seafoam);
        }

        .related-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .related-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 4px;
            transition: color 0.3s ease;
        }

        body.dark-mode .related-title {
            color: var(--dark-text-primary);
        }

        .related-artist {
            font-size: 0.8rem;
            color: var(--text);
            transition: color 0.3s ease;
        }

        body.dark-mode .related-artist {
            color: var(--dark-text-secondary);
        }

        .related-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.8rem;
            color: var(--text);
        }

        /* Global Player Styles */
        .global-player {
            grid-area: player;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--white);
            border-top: 1px solid var(--gray);
            display: flex;
            align-items: center;
            padding: 0 24px;
            height: 80px;
            box-shadow: 0 -2px 10px var(--shadow);
            z-index: 99;
            transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        body.dark-mode .global-player {
            background-color: var(--dark-card-bg);
            border-top: 1px solid var(--dark-border-color);
            box-shadow: 0 -2px 10px var(--dark-shadow);
        }

        .now-playing {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .now-playing-img {
            width: 50px;
            height: 50px;
            border-radius: 6px;
            object-fit: cover;
        }

        .now-playing-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .now-playing-title {
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        body.dark-mode .now-playing-title {
            color: var(--dark-text-primary);
        }

        .now-playing-artist {
            font-size: 0.8rem;
            color: var(--text-secondary, var(--text));
            transition: color 0.3s ease;
        }

        body.dark-mode .now-playing-artist {
            color: var(--dark-text-secondary);
        }

        .player-controls {
            flex: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .control-buttons {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .control-button {
            background: transparent;
            border: none;
            color: var(--text-secondary, var(--text));
            cursor: pointer;
            font-size: 1rem;
            transition: color 0.2s;
        }

        body.dark-mode .control-button {
            color: var(--dark-text-secondary);
        }

        .control-button:hover, .control-button.active {
            color: var(--text-primary, var(--dark));
        }

        body.dark-mode .control-button:hover, 
        body.dark-mode .control-button.active {
            color: var(--dark-text-primary);
        }

        .control-button.play-pause {
            width: 36px;
            height: 36px;
            background-color: var(--primary-color, var(--seafoam));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1rem;
            transition: background-color 0.3s ease;
        }

        .control-button.play-pause:hover {
            background-color: var(--primary-light, var(--rustic-pink));
            color: white;
        }

        .progress-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .time {
            font-size: 0.7rem;
            color: var(--text-secondary, var(--text));
            min-width: 35px;
            transition: color 0.3s ease;
        }

        body.dark-mode .time {
            color: var(--dark-text-secondary);
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            background-color: var(--hover-color, var(--gray));
            border-radius: 2px;
            position: relative;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        body.dark-mode .progress-bar {
            background-color: var(--dark-hover-color);
        }

        .progress {
            height: 100%;
            background-color: var(--primary-color, var(--seafoam));
            border-radius: 2px;
            width: 30%;
            transition: background-color 0.3s ease;
        }

        .volume-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
        }

        .volume-icon {
            color: var(--text-secondary, var(--text));
            cursor: pointer;
            transition: color 0.3s ease;
        }

        body.dark-mode .volume-icon {
            color: var(--dark-text-secondary);
        }

        .volume-slider {
            width: 80px;
            height: 4px;
            background-color: var(--hover-color, var(--gray));
            border-radius: 2px;
            position: relative;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        body.dark-mode .volume-slider {
            background-color: var(--dark-hover-color);
        }

        .volume-level {
            height: 100%;
            background-color: var(--text-secondary, var(--seafoam));
            border-radius: 2px;
            width: 70%;
            transition: background-color 0.3s ease;
        }

        body.dark-mode .volume-level {
            background-color: var(--seafoam);
        }

        /* Responsive adjustments for player */
        @media (max-width: 768px) {
            .global-player {
                padding: 0 12px;
            }

            .now-playing-img {
                width: 40px;
                height: 40px;
            }

            .volume-container {
                display: none;
            }
        }

        @media (max-width: 992px) {
            .feed {
                padding: 0;
            }
            
            .track-item {
                padding: 16px 20px;
            }
            
            .global-player {
                padding: 16px 20px 16px 260px;
            }
        }

        .search-box input:focus {
            border-color: var(--seafoam);
            background-color: var(--white);
        }

        body.dark-mode .search-box input:focus {
            border-color: var(--seafoam);
            background-color: var(--dark-hover-color);
        }

        .track-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
        }

        body.dark-mode .track-item:hover {
            box-shadow: 0 6px 16px var(--dark-shadow);
        }

        .related-track:hover {
            background-color: var(--gray);
        }

        body.dark-mode .related-track:hover {
            background-color: var(--dark-hover-color);
        }
    </style>
</head>
<body>
    <!-- Vertical Navbar -->
    <nav class="navbar">
        <div class="logo">
            <span>Collabo</span>
        </div>
        <div class="search-box">
            <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" placeholder="Search for artists, tracks...">
        </div>
        <div class="nav-links">
            <a href="#" class="nav-link active">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                Home
            </a>
            <a href="#" class="nav-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9"></path>
                    <rect x="3" y="15" width="18" height="7" rx="2"></rect>
                </svg>
                Library
            </a>
            <a href="#" class="nav-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <circle cx="10" cy="10.5" r="2.5"></circle>
                    <path d="M16 18.5c0-1.4-1.1-2.5-2.5-2.5h-7c-1.4 0-2.5 1.1-2.5 2.5"></path>
                </svg>
                Artists
            </a>
            <a href="#" class="nav-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 18V5l12-2v13"></path>
                    <circle cx="6" cy="18" r="3"></circle>
                    <circle cx="18" cy="16" r="3"></circle>
                </svg>
                Discover
            </a>

    </main>

    <!-- Global Player -->
    <div class="global-player">
        <div class="now-playing">
            <img src="/api/placeholder/96/96" alt="Album Art" class="now-playing-img">
            <div class="now-playing-info">
                <div class="now-playing-title">Summer Breeze (Acoustic Guitar)</div>
                <div class="now-playing-artist">Emma Davis</div>
            </div>
        </div>
        
        <div class="player-controls">
            <div class="control-buttons">
                <button class="control-button">
                    <i class="fas fa-random"></i>
                </button>
                <button class="control-button">
                    <i class="fas fa-step-backward"></i>
                </button>
                <button class="control-button play-pause">
                    <i class="fas fa-pause"></i>
                </button>
                <button class="control-button">
                    <i class="fas fa-step-forward"></i>
                </button>
                <button class="control-button">
                    <i class="fas fa-redo"></i>
                </button>
            </div>
            
            <div class="progress-container">
                <div class="time">1:24</div>
                <div class="progress-bar">
                    <div class="progress"></div>
                </div>
                <div class="time">3:45</div>
            </div>
        </div>
        
        <div class="volume-container">
            <i class="fas fa-volume-up volume-icon"></i>
            <div class="volume-slider">
                <div class="volume-level"></div>
            </div>
        </div>
    </div>

    <script>
        // Toggle dark mode
        document.querySelector('.theme-toggle').addEventListener('click', function() {
            document.body.classList.toggle('dark-mode');
        });

        // Toggle track expansion
        document.querySelectorAll('.track-main').forEach(track => {
            track.addEventListener('click', function() {
                const trackItem = this.closest('.track-item');
                document.querySelectorAll('.track-item').forEach(item => {
                    if (item !== trackItem) {
                        item.classList.remove('expanded');
                    }
                });
                trackItem.classList.toggle('expanded');
            });
        });

        // Prevent propagation for action buttons
        document.querySelectorAll('.track-actions button, .track-play').forEach(button => {
            button.addEventListener('click', function(e) {
                e.stopPropagation();
            });
        });
    </script>
