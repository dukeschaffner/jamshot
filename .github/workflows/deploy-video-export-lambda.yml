name: Deploy Video Export Lambda to AWS

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'functions/lambda/video-export/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - prod
      reason:
        description: 'Reason for deployment'
        required: false
        default: 'Manual deployment'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build-artifact: video-export-lambda-build-${{ github.run_number }}
    defaults:
      run:
        working-directory: ./functions/lambda/video-export/

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt -t package/

    - name: Copy source code to package directory
      run: |
        cp handler.py package/
        cp -r utils package/
        cp -r assets package/ 2>/dev/null || true

    - name: Create deployment package
      run: |
        cd package
        zip -r ../video-export-lambda.zip . \
          -x "*.pyc" \
          -x "__pycache__/*" \
          -x "*.py[cod]" \
          -x "*$py.class" \
          -x "*.dist-info/*" \
          -x "*.egg-info/*"

    # TEMPORARY: Using S3 storage instead of GitHub artifacts
    - name: Configure AWS credentials for S3 upload
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-2

    - name: Upload artifact to S3
      run: |
        aws s3 cp video-export-lambda.zip s3://sterio/lambda-artifacts/video-export-lambda-latest.zip --acl private

    # COMMENTED OUT: Original GitHub artifact upload (uncomment to revert)
    # - name: Upload build artifact
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: video-export-lambda-build-${{ github.run_number }}
    #     path: ./functions/lambda/video-export/video-export-lambda.zip

  deploy-to-test:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: video-export-test
      url: ${{ vars.VIDEO_EXPORT_LAMBDA_TEST_URL }}
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'test')

    steps:
    # TEMPORARY: Using S3 download instead of GitHub artifacts
    - name: Configure AWS credentials for S3 download
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-2

    - name: Download artifact from S3
      run: |
        aws s3 cp s3://sterio/lambda-artifacts/video-export-lambda-latest.zip video-export-lambda.zip

    # COMMENTED OUT: Original GitHub artifact download (uncomment to revert)
    # - name: Download build artifact
    #   uses: actions/download-artifact@v4
    #   with:
    #     name: ${{ needs.build.outputs.build-artifact }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.AWS_REGION_TEST || 'us-east-2' }}

    - name: Deploy to Test Lambda
      run: |
        aws lambda update-function-code \
          --function-name sterio-video-export-test \
          --zip-file fileb://video-export-lambda.zip

    - name: Wait for code deployment to complete
      run: |
        aws lambda wait function-updated --function-name sterio-video-export-test

    - name: Update Lambda configuration
      run: |
        aws lambda update-function-configuration \
          --function-name sterio-video-export-test \
          --handler handler.handler \
          --environment Variables="{
            DB_HOST=${{ secrets.DB_HOST_TEST }},
            DB_USER=${{ secrets.DB_USER }},
            DB_PASSWORD=${{ secrets.DB_PASSWORD_TEST }},
            DB_NAME=${{ secrets.DB_NAME }},
            DB_PORT=${{ secrets.DB_PORT }},
            R2_ENDPOINT=${{ secrets.R2_ENDPOINT_TEST }},
            R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID_TEST }},
            R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY_TEST }},
            R2_BUCKET=${{ secrets.R2_BUCKET_TEST }},
            R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL_TEST }},
            NODE_ENV=test
          }"

  deploy-to-prod:
    runs-on: ubuntu-latest
    needs: [build, deploy-to-test]
    environment:
      name: video-export-prod
      url: ${{ vars.VIDEO_EXPORT_LAMBDA_PROD_URL }}
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')

    steps:
    # TEMPORARY: Using S3 download instead of GitHub artifacts
    - name: Configure AWS credentials for S3 download
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-2

    - name: Download artifact from S3
      run: |
        aws s3 cp s3://sterio/lambda-artifacts/video-export-lambda-latest.zip video-export-lambda.zip

    # COMMENTED OUT: Original GitHub artifact download (uncomment to revert)
    # - name: Download build artifact
    #   uses: actions/download-artifact@v4
    #   with:
    #     name: ${{ needs.build.outputs.build-artifact }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.AWS_REGION_PROD || 'us-east-2' }}

    - name: Deploy to Prod Lambda
      run: |
        aws lambda update-function-code \
          --function-name sterio-video-export \
          --zip-file fileb://video-export-lambda.zip

    - name: Wait for code deployment to complete
      run: |
        aws lambda wait function-updated --function-name sterio-video-export

    - name: Update Lambda configuration
      run: |
        aws lambda update-function-configuration \
          --function-name sterio-video-export \
          --handler handler.handler \
          --environment Variables="{
            DB_HOST=${{ secrets.DB_HOST_PROD }},
            DB_USER=${{ secrets.DB_USER }},
            DB_PASSWORD=${{ secrets.DB_PASSWORD_PROD }},
            DB_NAME=${{ secrets.DB_NAME }},
            DB_PORT=${{ secrets.DB_PORT }},
            R2_ENDPOINT=${{ secrets.R2_ENDPOINT_PROD }},
            R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID_PROD }},
            R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY_PROD }},
            R2_BUCKET=${{ secrets.R2_BUCKET_PROD }},
            R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL_PROD }},
            NODE_ENV=production
          }"

