name: Deploy Admin to AWS Amplify

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'admin/**'
      - 'packages/dev-env/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - prod

jobs:
  deploy-to-test:
    runs-on: ubuntu-latest
    environment:
      name: admin-test
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'test')
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.AWS_REGION_TEST || 'us-east-2' }}

    - name: Deploy Admin to Test Amplify
      run: |
        aws amplify start-job \
          --app-id ${{ vars.ADMIN_AMPLIFY_APP_ID }} \
          --branch-name dev \
          --job-type RELEASE

  deploy-to-prod:
    runs-on: ubuntu-latest
    needs: deploy-to-test
    environment:
      name: admin-prod
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.AWS_REGION_PROD || 'us-east-2' }}

    - name: Deploy Admin to Prod Amplify
      run: |
        aws amplify start-job \
          --app-id ${{ vars.ADMIN_AMPLIFY_APP_ID }} \
          --branch-name main \
          --job-type RELEASE
