name: Deploy Audio Processing Lambda to AWS

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'functions/lambda/audio-processing/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - prod
      reason:
        description: 'Reason for deployment'
        required: false
        default: 'Manual deployment'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build-artifact: audio-processing-lambda-build-${{ github.run_number }}
    defaults:
      run:
        working-directory: ./functions/lambda/audio-processing/

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js 22
      uses: actions/setup-node@v3
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: './functions/lambda/audio-processing/package-lock.json'

    - name: Install dependencies
      run: |
        npm ci

    # - name: Run tests
    #   run: |
    #     npm test

    - name: Create deployment package
      run: |
        # Create deployment zip similar to existing script but CI-friendly
        zip -r audio-processing-lambda.zip . \
          -x ".env*" \
          -x "test/*" \
          -x "*.md" \
          -x "package-lock.json" \
          -x "scripts/*" \
          -x ".git/*" \
          -x "node_modules/.cache/*" \
          -x "dev-server.js" \
          -x "dev-start.js" \
          -x "temp/*"

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: audio-processing-lambda-build-${{ github.run_number }}
        path: ./functions/lambda/audio-processing/audio-processing-lambda.zip

  deploy-to-test:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: audio-processing-test
      url: ${{ vars.AUDIO_PROCESSING_LAMBDA_TEST_URL }}
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'test')

    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ needs.build.outputs.build-artifact }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.AWS_REGION_TEST || 'us-east-2' }}

    - name: Deploy to Test Lambda
      run: |
        aws lambda update-function-code \
          --function-name sterio-audio-processor-test \
          --zip-file fileb://audio-processing-lambda.zip

    - name: Wait for code deployment to complete
      run: |
        aws lambda wait function-updated --function-name sterio-audio-processor-test

    - name: Update Lambda configuration
      run: |
        aws lambda update-function-configuration \
          --function-name sterio-audio-processor-test \
          --environment Variables="{
            DB_HOST=${{ secrets.DB_HOST_TEST }},
            DB_USER=${{ secrets.DB_USER }},
            DB_PASSWORD=${{ secrets.DB_PASSWORD_TEST }},
            DB_NAME=${{ secrets.DB_NAME }},
            DB_PORT=${{ secrets.DB_PORT }},
            R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID_TEST }},
            R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY_TEST }},
            R2_ENDPOINT=${{ secrets.R2_ENDPOINT_TEST }},
            R2_BUCKET=${{ secrets.R2_BUCKET_TEST }},
            R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL_TEST }},
            NODE_ENV=test
          }"

  deploy-to-prod:
    runs-on: ubuntu-latest
    needs: [build, deploy-to-test]
    environment:
      name: audio-processing-prod
      url: ${{ vars.AUDIO_PROCESSING_LAMBDA_PROD_URL }}
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')

    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ needs.build.outputs.build-artifact }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.AWS_REGION_PROD || 'us-east-2' }}

    - name: Deploy to Prod Lambda
      run: |
        aws lambda update-function-code \
          --function-name sterio-audio-processor \
          --zip-file fileb://audio-processing-lambda.zip

    - name: Wait for code deployment to complete
      run: |
        aws lambda wait function-updated --function-name sterio-audio-processor

    - name: Update Lambda configuration
      run: |
        aws lambda update-function-configuration \
          --function-name sterio-audio-processor \
          --environment Variables="{
            DB_HOST=${{ secrets.DB_HOST_PROD }},
            DB_USER=${{ secrets.DB_USER }},
            DB_PASSWORD=${{ secrets.DB_PASSWORD_PROD }},
            DB_NAME=${{ secrets.DB_NAME }},
            DB_PORT=${{ secrets.DB_PORT }},
            R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID_PROD }},
            R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY_PROD }},
            R2_ENDPOINT=${{ secrets.R2_ENDPOINT_PROD }},
            R2_BUCKET=${{ secrets.R2_BUCKET_PROD }},
            R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL_PROD }},
            NODE_ENV=production
          }"

