name: Deploy API to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'packages/subscription-config/**'  # Trigger on package changes too
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for deployment'
        required: false
        default: 'Manual deployment'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Node.js 22
      uses: actions/setup-node@v3
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: './api/package-lock.json'
        
    - name: Build subscription-config package
      working-directory: ./packages/subscription-config
      run: |
        npm run build
        
    - name: Install API dependencies
      working-directory: ./api
      run: |
        npm ci
        
    - name: Build API
      working-directory: ./api
      run: |
        npm run build --if-present
        
    - name: Make FFMPEG binary executable
      working-directory: ./api
      run: |
        chmod +x ./bin/ffmpeg
        
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'jamshot-api'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_API }}
        package: './api'
        # Note: Azure deployment now includes the packages/ directory
        # because npm ci copies the local dependency into node_modules