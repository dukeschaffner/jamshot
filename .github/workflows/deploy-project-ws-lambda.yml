name: Deploy Project WS Lambda to AWS

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'functions/lambda/project-ws/**'
      - 'api/lambda/src/projectWs/**'
      - 'api/lambda/auth.js'
      - 'packages/db-config/**'
      - 'packages/subscription-utils/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - prod
      reason:
        description: 'Reason for deployment'
        required: false
        default: 'Manual deployment'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./functions/lambda/project-ws/

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: './package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Build Lambda package
      run: npm run build

    - name: Create deployment package
      run: zip -r project-ws-lambda.zip dist/

    - name: Configure AWS credentials for S3 upload
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-2

    - name: Upload artifact to S3
      run: |
        aws s3 cp project-ws-lambda.zip s3://sterio/lambda-artifacts/project-ws-lambda-latest.zip --acl private

  deploy-to-test:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: project-ws-test
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'test')

    steps:
    - name: Configure AWS credentials for S3 download
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-2

    - name: Download artifact from S3
      run: aws s3 cp s3://sterio/lambda-artifacts/project-ws-lambda-latest.zip project-ws-lambda.zip

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.AWS_REGION_TEST || 'us-east-2' }}

    - name: Deploy to Test Lambda
      run: |
        aws lambda update-function-code \
          --function-name sterio-project-ws-test \
          --zip-file fileb://project-ws-lambda.zip

    - name: Wait for code deployment to complete
      run: aws lambda wait function-updated --function-name sterio-project-ws-test

    - name: Update Lambda configuration
      run: |
        aws lambda update-function-configuration \
          --function-name sterio-project-ws-test \
          --handler index.handler \
          --environment Variables="{
            DB_HOST=${{ secrets.DB_HOST_TEST }},
            DB_NAME=${{ secrets.DB_NAME }},
            DB_PASSWORD=${{ secrets.DB_PASSWORD_TEST }},
            DB_PORT=${{ secrets.DB_PORT }},
            DB_USER=${{ secrets.DB_USER }},
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET_TEST }},
            BETTER_AUTH_URL=${{ vars.BETTER_AUTH_URL_TEST }},
            FRONTEND_URL=${{ secrets.FRONTEND_URL_TEST }},
            NODE_ENV=test
          }"

  deploy-to-prod:
    runs-on: ubuntu-latest
    needs: [build, deploy-to-test]
    environment:
      name: project-ws-prod
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')

    steps:
    - name: Configure AWS credentials for S3 download
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-2

    - name: Download artifact from S3
      run: aws s3 cp s3://sterio/lambda-artifacts/project-ws-lambda-latest.zip project-ws-lambda.zip

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.AWS_REGION_PROD || 'us-east-2' }}

    - name: Deploy to Prod Lambda
      run: |
        aws lambda update-function-code \
          --function-name sterio-project-ws \
          --zip-file fileb://project-ws-lambda.zip

    - name: Wait for code deployment to complete
      run: aws lambda wait function-updated --function-name sterio-project-ws

    - name: Update Lambda configuration
      run: |
        aws lambda update-function-configuration \
          --function-name sterio-project-ws \
          --handler index.handler \
          --environment Variables="{
            DB_HOST=${{ secrets.DB_HOST_PROD }},
            DB_NAME=${{ secrets.DB_NAME }},
            DB_PASSWORD=${{ secrets.DB_PASSWORD_PROD }},
            DB_PORT=${{ secrets.DB_PORT }},
            DB_USER=${{ secrets.DB_USER }},
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET_PROD }},
            BETTER_AUTH_URL=${{ vars.BETTER_AUTH_URL_PROD }},
            FRONTEND_URL=${{ secrets.FRONTEND_URL_PROD }},
            NODE_ENV=production
          }"
