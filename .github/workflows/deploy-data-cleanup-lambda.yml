name: Deploy Data Cleanup Lambda to AWS

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'functions/lambda/data-cleanup/**'
      - 'packages/db-config/**'
      - 'packages/subscription-utils/**'
      - 'packages/email/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - prod
      reason:
        description: 'Reason for deployment'
        required: false
        default: 'Manual deployment'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./functions/lambda/data-cleanup/

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: './package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Build Lambda package
      run: npm run build

    - name: Create deployment package
      run: zip -r data-cleanup-lambda.zip dist/

    - name: Configure AWS credentials for S3 upload
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-2

    - name: Upload artifact to S3
      run: |
        aws s3 cp data-cleanup-lambda.zip s3://sterio/lambda-artifacts/data-cleanup-lambda-latest.zip --acl private

  deploy-to-test:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: data-cleanup-test
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'test')

    steps:
    - name: Configure AWS credentials for S3 download
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-2

    - name: Download artifact from S3
      run: |
        aws s3 cp s3://sterio/lambda-artifacts/data-cleanup-lambda-latest.zip data-cleanup-lambda.zip

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.AWS_REGION_TEST || 'us-east-2' }}

    - name: Deploy to Test Lambda
      run: |
        aws lambda update-function-code \
          --function-name sterio-data-cleanup-test \
          --zip-file fileb://data-cleanup-lambda.zip

    - name: Wait for code deployment to complete
      run: aws lambda wait function-updated --function-name sterio-data-cleanup-test

    - name: Update Lambda configuration
      run: |
        aws lambda update-function-configuration \
          --function-name sterio-data-cleanup-test \
          --handler dist/index.handler \
          --environment Variables="{
            DB_HOST=${{ secrets.DB_HOST_TEST }},
            DB_NAME=${{ secrets.DB_NAME }},
            DB_PASSWORD=${{ secrets.DB_PASSWORD_TEST }},
            DB_PORT=${{ secrets.DB_PORT }},
            DB_USER=${{ secrets.DB_USER }},
            R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID_TEST }},
            R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY_TEST }},
            R2_ENDPOINT=${{ secrets.R2_ENDPOINT_TEST }},
            R2_BUCKET=${{ secrets.R2_BUCKET_TEST }},
            PROJECT_ASSET_CLEANUP_DRY_RUN=true,
            PROJECT_RETENTION_DRY_RUN=true,
            EMAIL=${{ secrets.EMAIL }},
            EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }},
            SMTP_HOST=${{ secrets.SMTP_HOST }},
            SMTP_PORT=${{ secrets.SMTP_PORT }},
            SMTP_SECURE=${{ secrets.SMTP_SECURE }},
            FRONTEND_URL=${{ secrets.FRONTEND_URL_TEST }},
            TEST_EMAIL=${{ vars.TEST_EMAIL }},
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY_TEST }},
            NODE_ENV=test
          }"

  deploy-to-prod:
    runs-on: ubuntu-latest
    needs: [build, deploy-to-test]
    environment:
      name: data-cleanup-prod
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')

    steps:
    - name: Configure AWS credentials for S3 download
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-2

    - name: Download artifact from S3
      run: |
        aws s3 cp s3://sterio/lambda-artifacts/data-cleanup-lambda-latest.zip data-cleanup-lambda.zip

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.AWS_REGION_PROD || 'us-east-2' }}

    - name: Deploy to Prod Lambda
      run: |
        aws lambda update-function-code \
          --function-name sterio-data-cleanup \
          --zip-file fileb://data-cleanup-lambda.zip

    - name: Wait for code deployment to complete
      run: aws lambda wait function-updated --function-name sterio-data-cleanup

    - name: Update Lambda configuration
      run: |
        aws lambda update-function-configuration \
          --function-name sterio-data-cleanup \
          --handler dist/index.handler \
          --environment Variables="{
            DB_HOST=${{ secrets.DB_HOST_PROD }},
            DB_NAME=${{ secrets.DB_NAME }},
            DB_PASSWORD=${{ secrets.DB_PASSWORD_PROD }},
            DB_PORT=${{ secrets.DB_PORT }},
            DB_USER=${{ secrets.DB_USER }},
            R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID_PROD }},
            R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY_PROD }},
            R2_ENDPOINT=${{ secrets.R2_ENDPOINT_PROD }},
            R2_BUCKET=${{ secrets.R2_BUCKET_PROD }},
            PROJECT_ASSET_CLEANUP_DRY_RUN=true,
            PROJECT_RETENTION_DRY_RUN=true,
            EMAIL=${{ secrets.EMAIL }},
            EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }},
            SMTP_HOST=${{ secrets.SMTP_HOST }},
            SMTP_PORT=${{ secrets.SMTP_PORT }},
            SMTP_SECURE=${{ secrets.SMTP_SECURE }},
            FRONTEND_URL=${{ secrets.FRONTEND_URL_PROD }},
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY_PROD }},
            NODE_ENV=production
          }"
