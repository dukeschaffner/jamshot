name: Deploy UI to AWS Amplify

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'ui/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - prod
      reason:
        description: 'Reason for deployment'
        required: false
        default: 'Manual deployment'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build-artifact: ui-build-${{ github.run_number }}
    defaults:
      run:
        working-directory: ./ui/

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js 22
      uses: actions/setup-node@v3
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: './ui/package-lock.json'

    - name: Install dependencies
      run: |
        npm ci

    - name: Run linting
      run: |
        npm run lint

    - name: Build Next.js app
      run: |
        npm run build

    # - name: Upload build artifact
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: ui-build-${{ github.run_number }}
    #     path: ./ui/

  deploy-to-test:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: ui-test
      url: ${{ vars.UI_TEST_URL }}
    if: github.ref == 'refs/heads/dev' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'test')
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.AWS_REGION_TEST || 'us-east-2' }}

    - name: Deploy to Test Amplify
      run: |
        aws amplify start-job \
          --app-id d3cx888lrkmdbn \
          --branch-name dev \
          --job-type RELEASE

  deploy-to-prod:
    runs-on: ubuntu-latest
    needs: [build, deploy-to-test]
    environment:
      name: ui-prod
      url: ${{ vars.UI_PROD_URL }}
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.AWS_REGION_PROD || 'us-east-2' }}

    - name: Deploy to Prod Amplify
      run: |
        aws amplify start-job \
          --app-id d3cx888lrkmdbn \
          --branch-name main \
          --job-type RELEASE
