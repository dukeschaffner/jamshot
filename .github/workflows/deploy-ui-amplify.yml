name: Deploy UI to AWS Amplify

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'ui/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - main
      reason:
        description: 'Reason for deployment'
        required: false
        default: 'Manual deployment'

jobs:
  # approve:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Wait for approval
  #       uses: trstringer/manual-approval@v1
  #       with:
  #         secret: ${{ github.TOKEN }}
  #         approvers: dukeschaffner
  #         timeout_minutes: 60
  #     - name: Deploy to production
  #       run: |
  #         echo "Deploying to production..."

  build:
    runs-on: ubuntu-latest
    outputs:
      build-artifact: ui-build-${{ github.run_number }}
    defaults:
      run:
        working-directory: ./ui/

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: './ui/package-lock.json'

    - name: Install dependencies
      run: |
        npm ci

    - name: Run linting
      run: |
        npm run lint

    - name: Upload source artifact
      uses: actions/upload-artifact@v4
      with:
        name: ui-build-${{ github.run_number }}
        path: ./ui/
        retention-days: 7

  deploy-to-dev:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: ui-dev
      url: ${{ vars.AMPLIFY_DEV_URL }}
    if: github.ref == 'refs/heads/dev' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')

    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ needs.build.outputs.build-artifact }}
        path: ./build

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.AWS_REGION_TEST || 'us-east-2' }}

    - name: Create deployment zip
      run: |
        cd build
        zip -r ../deployment.zip . -x "*.DS_Store*" "__MACOSX*"

    - name: Deploy to Dev Amplify
      run: |
        # Start a new deployment
        DEPLOYMENT_ID=$(aws amplify start-deployment \
          --app-id ${{ vars.AMPLIFY_APP_ID }} \
          --branch-name dev \
          --source-url file://deployment.zip \
          --query 'jobSummary.jobId' \
          --output text)
        
        echo "Deployment ID: $DEPLOYMENT_ID"
        echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> $GITHUB_ENV
        
        # Wait for deployment to complete
        echo "Waiting for deployment to complete..."
        aws amplify wait job-completed \
          --app-id ${{ vars.AMPLIFY_APP_ID }} \
          --branch-name dev \
          --job-id $DEPLOYMENT_ID

    - name: Verify deployment
      run: |
        # Get deployment status
        STATUS=$(aws amplify get-job \
          --app-id ${{ vars.AMPLIFY_APP_ID }} \
          --branch-name dev \
          --job-id $DEPLOYMENT_ID \
          --query 'job.summary.status' \
          --output text)
        
        echo "Final deployment status: $STATUS"
        
        if [ "$STATUS" != "SUCCEED" ]; then
          echo "Deployment failed with status: $STATUS"
          exit 1
        fi

  deploy-to-main:
    runs-on: ubuntu-latest
    needs: [build, deploy-to-dev]
    environment:
      name: ui-main
      url: ${{ vars.AMPLIFY_MAIN_URL }}
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'main')

    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ needs.build.outputs.build-artifact }}
        path: ./build

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.AWS_REGION_PROD || 'us-east-2' }}

    - name: Create deployment zip
      run: |
        cd build
        zip -r ../deployment.zip . -x "*.DS_Store*" "__MACOSX*"

    - name: Deploy to Main Amplify
      run: |
        # Start a new deployment
        DEPLOYMENT_ID=$(aws amplify start-deployment \
          --app-id ${{ vars.AMPLIFY_APP_ID }} \
          --branch-name main \
          --source-url file://deployment.zip \
          --query 'jobSummary.jobId' \
          --output text)
        
        echo "Deployment ID: $DEPLOYMENT_ID"
        echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> $GITHUB_ENV
        
        # Wait for deployment to complete
        echo "Waiting for deployment to complete..."
        aws amplify wait job-completed \
          --app-id ${{ vars.AMPLIFY_APP_ID }} \
          --branch-name main \
          --job-id $DEPLOYMENT_ID

    - name: Verify deployment
      run: |
        # Get deployment status
        STATUS=$(aws amplify get-job \
          --app-id ${{ vars.AMPLIFY_APP_ID }} \
          --branch-name main \
          --job-id $DEPLOYMENT_ID \
          --query 'job.summary.status' \
          --output text)
        
        echo "Final deployment status: $STATUS"
        
        if [ "$STATUS" != "SUCCEED" ]; then
          echo "Deployment failed with status: $STATUS"
          exit 1
        fi

    - name: Create deployment tag
      uses: actions/checkout@v4
    - name: Tag successful deployment
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git tag -a "ui-v${{ github.run_number }}" -m "UI deployment ${{ github.run_number }}"
        git push origin "ui-v${{ github.run_number }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
