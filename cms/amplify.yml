version: 1
applications:
  - appRoot: cms
    frontend:
      phases:
        preBuild:
          commands:
            - cd ..
            - npm ci --cache .npm --prefer-offline
            - cd cms
        build:
          commands:
            # Amplify console vars are build-only unless written into .env.production for SSR runtime.
            # Quote values so special chars (e.g. # in PAYLOAD_SECRET) are not treated as comments.
            - echo "PAYLOAD_SECRET=\"$PAYLOAD_SECRET\"" > .env.production
            - echo "CMS_DATABASE_URL=\"$CMS_DATABASE_URL\"" >> .env.production
            - echo "SERVER_URL=\"$SERVER_URL\"" >> .env.production
            - echo "FRONTEND_URL=\"$FRONTEND_URL\"" >> .env.production
            - echo "PREVIEW_SECRET=\"$PREVIEW_SECRET\"" >> .env.production
            - npm run build
            # Payload/pino externalizes thread-stream; Lambda expects it at .next/node_modules/thread-stream.
            - mkdir -p .next/node_modules/thread-stream .next/node_modules/real-require
            - cp ../node_modules/payload/node_modules/thread-stream/index.js ../node_modules/payload/node_modules/thread-stream/package.json .next/node_modules/thread-stream/
            - cp -r ../node_modules/payload/node_modules/thread-stream/lib .next/node_modules/thread-stream/
            - cp -r ../node_modules/real-require/* .next/node_modules/real-require/
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - .npm/**/*
          - ../node_modules/**/*
