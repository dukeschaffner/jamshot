version: 1
applications:
  - appRoot: cms
    frontend:
      phases:
        preBuild:
          commands:
            - cd ..
            - npm ci --workspace=cms --include-workspace-root --cache .npm --prefer-offline
            - cd cms
        build:
          commands:
            - export NODE_ENV=production
            - npm run build
            - rm -rf .next/cache .next/standalone
            - rm -rf ../node_modules/next/next-swc-fallback ../node_modules/@swc ../node_modules/@esbuild
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - .npm/**/*
